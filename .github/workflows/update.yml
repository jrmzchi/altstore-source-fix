name: Update AltStore Source
on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-source
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Update and validate
        run: python scripts/update.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- apps.json dedup-report.json && [ -z "$(git ls-files --others --exclude-standard apps.json dedup-report.json)" ]; then
            echo 'No changes'; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps.json dedup-report.json
          git commit -m 'chore: sync validated AltStore source'
          git push
